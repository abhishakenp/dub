name: build-dub-app
# Standalone self-hosted Dub build → GHCR. The image is built on Depot's remote
# BuildKit (project dub-selfhost), NOT on exodus and NOT on the GH runner's CPU —
# the ubuntu-latest job only orchestrates. Dokploy then merely pulls the image.
on:
  push:
    branches: [selfhost/dev-stack]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/build-dub-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Depot CLI
        uses: depot/setup-action@v1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image (Depot remote BuildKit)
        uses: depot/build-push-action@v1
        with:
          project: w3hftxfprt
          token: ${{ secrets.DEPOT_TOKEN }}
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/shiphelper/dub-selfhost-app:latest
            ghcr.io/shiphelper/dub-selfhost-app:${{ github.sha }}

name: build-dub-app

# Build the self-hosted Dub app image on Blacksmith (NOT on exodus — the heavy
# next build OOMs the prod box). Push to GHCR; Dokploy then only pulls it.
on:
  push:
    branches: [selfhost/dev-stack]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/build-dub-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Blacksmith Docker builder (sticky-disk layer cache)
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/dub-selfhost-app:latest
            ghcr.io/${{ github.repository_owner }}/dub-selfhost-app:${{ github.sha }}

name: build-dub-app
# Standalone self-hosted Dub build → GHCR. Built on a GitHub-hosted ubuntu-latest
# runner (NOT on exodus — the next build there OOMs prod). Dokploy only pulls the
# resulting image. GHA layer cache offsets cold-build cost; a disk-reclaim step
# frees room for the large pnpm/turbo monorepo image on the 14 GB runner.
on:
  push:
    branches: [selfhost/dev-stack]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/build-dub-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Reclaim runner disk (drop unused preinstalled toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/shiphelper/dub-selfhost-app:latest
            ghcr.io/shiphelper/dub-selfhost-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
